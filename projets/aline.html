<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aline — Emilie Deboeck</title>
  <meta name="description" content="">
  <meta property="og:image" content="../assets/img/aline/affiche-1400.jpg">
  <link rel="icon" href="../assets/favicon.svg?v=2" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Outfit + DM Sans : les typos de la charte aline. Rubik : le bloc « projet suivant » (Touffe). -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Outfit:wght@300..800&family=Rubik:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/aline.css">
</head>
<body class="pg-aline" data-page="aline" data-root="../">

<main id="main">

  <!-- ========== EN-TÊTE DU PROJET ========== -->
  <section class="pj-hero on-dark" aria-labelledby="pj-title">
    <div class="wrap">
      <a class="pj-back" href="../index.html#projets" data-i18n="ui.back"></a>
      <h1 class="pj-title" id="pj-title">
        <img src="../assets/img/aline/wordmark.svg" width="3492" height="1188" alt="" data-i18n-attr="alt:pages.aline.title">
      </h1>
      <p class="pj-tagline" lang="fr" data-i18n="pages.aline.tagline"></p>

      <!-- Les chips de genres de l'app (décor) à gauche, le lien vers le prototype à droite -->
      <div class="al-hero-row">
        <ul class="al-chips" aria-hidden="true">
          <li class="is-live">live</li>
          <li style="--c: var(--al-pink);">indie pop</li>
          <li style="--c: var(--al-violet);">électro</li>
          <li style="--c: var(--al-green);">soul</li>
        </ul>
        <a class="al-try-btn" href="../aline-app/index.html" data-i18n="pages.aline.tryApp"></a>
      </div>

      <dl class="pj-meta">
        <div><dt data-i18n="pages.labels.client"></dt><dd data-i18n="pages.aline.client"></dd></div>
        <div><dt data-i18n="pages.labels.type"></dt><dd data-i18n="pages.aline.type"></dd></div>
        <div><dt data-i18n="pages.labels.year"></dt><dd data-i18n="pages.aline.year"></dd></div>
        <div><dt data-i18n="pages.labels.role"></dt><dd data-i18n="pages.aline.role"></dd></div>
      </dl>
    </div>
  </section>

  <!-- ========== 1. LA CAMPAGNE ========== -->
  <section class="pj-section" aria-labelledby="poster-title">
    <div class="wrap pj-split">
      <figure class="shot reveal al-poster">
        <img src="../assets/img/aline/affiche-800.jpg" srcset="../assets/img/aline/affiche-800.jpg 566w, ../assets/img/aline/affiche-1400.jpg 990w" sizes="(min-width: 860px) 520px, 90vw" width="566" height="800" alt="" data-i18n-attr="alt:pages.aline.alt.affiche">
      </figure>
      <div>
        <h2 id="poster-title" class="reveal" data-i18n="pages.aline.posterTitle"></h2>
        <p data-words data-i18n="pages.aline.posterText"></p>
        <img class="al-logo" src="../assets/img/aline/logo.svg" width="3492" height="1380" loading="lazy" alt="" data-i18n-attr="alt:pages.aline.alt.logo">
      </div>
    </div>
  </section>

  <!-- ========== 2. LE DÉFI ========== -->
  <section class="pj-section tinted on-dark" aria-labelledby="challenge-title">
    <div class="wrap pj-split">
      <div>
        <h2 id="challenge-title" class="reveal" data-i18n="pages.aline.challengeTitle"></h2>
        <p data-words data-i18n="pages.aline.challengeText"></p>
      </div>
      <div class="stat reveal">
        <strong data-i18n="pages.aline.stat.v"></strong>
        <span data-i18n="pages.aline.stat.l"></span>
      </div>
    </div>
  </section>

  <!-- ========== 3. LE TON ========== -->
  <section class="pj-section" aria-labelledby="voice-title">
    <div class="wrap">
      <h2 id="voice-title" class="reveal" data-i18n="pages.aline.voiceTitle"></h2>
      <p data-i18n="pages.aline.voiceText"></p>
      <ul class="voice" data-slide-in lang="fr" data-render="list" data-src="pages.aline.voice"></ul>
    </div>
  </section>

  <!-- ========== 4. LA CHARTE ========== -->
  <section class="pj-section tinted on-dark" aria-labelledby="charte-title">
    <div class="wrap pj-split">
      <div>
        <h2 id="charte-title" class="reveal" data-i18n="pages.aline.charteTitle"></h2>
        <p data-i18n="pages.aline.charteText"></p>

        <!-- Les deux familles de la charte, montrées dans leur propre police -->
        <div class="al-type" aria-hidden="true">
          <span class="al-type-display">outfit</span>
          <span class="al-type-body">dm sans</span>
        </div>

        <h3 class="reveal" data-i18n="pages.aline.paletteTitle"></h3>
        <ul class="swatches">
          <li style="background: #E8173D; color: #fff;">aline red <code>#E8173D</code></li>
          <li style="background: #F2621D; color: #0D0D0D;">orange <code>#F2621D</code></li>
          <li style="background: #F5E642; color: #0D0D0D;">jaune <code>#F5E642</code></li>
          <li style="background: #2DC76D; color: #0D0D0D;">vert <code>#2DC76D</code></li>
          <li style="background: #4DAAED; color: #0D0D0D;">bleu <code>#4DAAED</code></li>
          <li style="background: #8B7FE8; color: #0D0D0D;">violet <code>#8B7FE8</code></li>
          <li style="background: #F0509E; color: #0D0D0D;">rose <code>#F0509E</code></li>
          <li style="background: #FFFFFF; color: #0D0D0D;">blanc <code>#FFFFFF</code></li>
        </ul>
      </div>
      <figure class="shot reveal">
        <img src="../assets/img/aline/charte-900.jpg" srcset="../assets/img/aline/charte-900.jpg 636w, ../assets/img/aline/charte-1800.jpg 1272w, ../assets/img/aline/charte-3600.jpg 2544w" sizes="(min-width: 860px) 45vw, 90vw" width="636" height="900" loading="lazy" alt="" data-i18n-attr="alt:pages.aline.alt.charte">
      </figure>
    </div>
  </section>

  <!-- ========== 5. L'APP ========== -->
  <section class="pj-section" aria-labelledby="screens-title">
    <div class="wrap">
      <h2 id="screens-title" class="reveal" data-i18n="pages.aline.screensTitle"></h2>
      <p data-i18n="pages.aline.screensText"></p>
      <ol class="al-phones">
        <li class="reveal">
          <span class="al-phone-step" data-i18n="pages.aline.screens.s1"></span>
          <img src="../assets/img/aline/ecran-decouvrir-600.webp" srcset="../assets/img/aline/ecran-decouvrir-600.webp 600w, ../assets/img/aline/ecran-decouvrir-1200.webp 1200w" sizes="300px" width="600" height="1249" loading="lazy" alt="" data-i18n-attr="alt:pages.aline.alt.ecran1">
          <span class="al-phone-cap" data-i18n="pages.aline.screens.c1"></span>
        </li>
        <li class="reveal" style="--reveal-delay: 0.1s;">
          <span class="al-phone-step" data-i18n="pages.aline.screens.s2"></span>
          <img src="../assets/img/aline/ecran-concert-600.webp" srcset="../assets/img/aline/ecran-concert-600.webp 600w, ../assets/img/aline/ecran-concert-1200.webp 1200w" sizes="300px" width="600" height="1249" loading="lazy" alt="" data-i18n-attr="alt:pages.aline.alt.ecran2">
          <span class="al-phone-cap" data-i18n="pages.aline.screens.c2"></span>
        </li>
        <li class="reveal" style="--reveal-delay: 0.2s;">
          <span class="al-phone-step" data-i18n="pages.aline.screens.s3"></span>
          <img src="../assets/img/aline/ecran-agenda-600.webp" srcset="../assets/img/aline/ecran-agenda-600.webp 600w, ../assets/img/aline/ecran-agenda-1200.webp 1200w" sizes="300px" width="600" height="1249" loading="lazy" alt="" data-i18n-attr="alt:pages.aline.alt.ecran3">
          <span class="al-phone-cap" data-i18n="pages.aline.screens.c3"></span>
        </li>
      </ol>

      <!-- Le prototype cliquable (aline-app/), dans un iPhone -->
      <div class="al-try reveal">
        <a class="al-try-btn" href="../aline-app/index.html" data-i18n="pages.aline.tryApp"></a>
        <p data-i18n="pages.aline.tryText"></p>
      </div>
    </div>
  </section>

  <a class="next to-touffe" href="touffe.html">
    <span data-i18n="ui.next"></span>
    <strong><img src="../assets/img/touffe/logo.svg" width="4096" height="1210" alt="Touffe"><b aria-hidden="true">→</b></strong>
  </a>

</main>

<script src="../js/content.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
